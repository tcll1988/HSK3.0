<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>数据检查 · HSK 3.0</title>
  <link rel="icon" href="data:,">
  <style>
    :root { color-scheme: light; --paper: #f4f1e8; --paper-accent: #ede8dc; --card: #fffdf9; --ink: #222723; --muted: #5f665d; --line: #dcd8cc; --error: #9e392f; --error-bg: #f9e8e3; --warn: #8a5a12; --warn-bg: #f7eedb; --ok: #246344; --ok-bg: #e7f3eb; --shadow: 0 6px 20px -4px rgb(34 39 35 / .06), 0 2px 6px -2px rgb(34 39 35 / .04); }
    @media (prefers-color-scheme: dark) {
      :root { color-scheme: dark; --paper: #161a17; --paper-accent: #1c221e; --card: #202622; --ink: #eeece3; --muted: #a6afa4; --line: #343d36; --error: #f0a795; --error-bg: #452c26; --warn: #f1cf8b; --warn-bg: #45391f; --ok: #9ed4a7; --ok-bg: #263d2d; --shadow: 0 8px 24px -4px rgb(0 0 0 / .35); }
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background-color: var(--paper); background-image: radial-gradient(ellipse 90% 50% at 50% 0%, var(--paper-accent), transparent 70%); font: 400 1rem/1.7 "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Yu Gothic", sans-serif; -webkit-font-smoothing: antialiased; }
    main { max-width: 960px; margin: auto; padding: 36px 20px 64px; }
    h1 { margin: 0 0 6px; font-size: 1.55rem; letter-spacing: .01em; }
    p { margin: 0 0 12px; }
    .muted { color: var(--muted); font-size: .875rem; }
    .summary { display: flex; flex-wrap: wrap; gap: 10px; margin: 18px 0; }
    .pill { padding: 6px 14px; border: 1px solid var(--line); border-radius: 999px; font-weight: 700; font-size: .875rem; }
    .pill.error { border-color: var(--error); color: var(--error); background: var(--error-bg); }
    .pill.warn { border-color: var(--warn); color: var(--warn); background: var(--warn-bg); }
    .pill.ok { border-color: var(--ok); color: var(--ok); background: var(--ok-bg); }
    section { margin-top: 18px; padding: 18px 20px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); box-shadow: var(--shadow); }
    h2 { margin: 0 0 10px; font-size: 1.05rem; }
    ul { margin: 0; padding-left: 1.2em; }
    li { margin: 5px 0; overflow-wrap: anywhere; }
    li .area { display: inline-block; min-width: 3.5em; color: var(--muted); font-size: .8125rem; font-weight: 600; }
    button { min-height: 44px; padding: 8px 18px; border: 1px solid var(--line); border-radius: 8px; color: var(--ok); background: var(--card); font: inherit; font-weight: 700; cursor: pointer; transition: border-color .15s ease, background-color .15s ease; }
    button:hover:not(:disabled) { border-color: var(--ok); background: var(--ok-bg); }
    button:disabled { color: var(--muted); cursor: default; }
    progress { width: 100%; height: 8px; margin-top: 12px; border: 0; border-radius: 999px; accent-color: var(--ok); }
    a { color: var(--ok); font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>数据检查</h1>
    <p class="muted">检查 data/ 里的词汇、汉字、语法和语法练习数据（规则和 <code>node tools/check.js</code> 相同）。改完数据后刷新本页即可。<a href="index.html">返回学习页面</a></p>
    <div class="summary" id="summary"></div>
    <div id="results"></div>
    <section>
      <h2>录音文件</h2>
      <p class="muted">逐个加载词汇用到的录音，确认文件都在、浏览器能读取（约一万个文件，需要几分钟）。</p>
      <button type="button" id="audio-check">开始检查录音</button>
      <progress id="audio-progress" value="0" max="1" hidden></progress>
      <p id="audio-status" class="muted" role="status"></p>
      <ul id="audio-missing"></ul>
    </section>
  </main>
  <script src="data/vocab.js"></script>
  <script src="data/chars.js"></script>
  <script src="data/grammar.js"></script>
  <script src="data/grammar-ja.js"></script>
  <script src="data/grammar-notes.js"></script>
  <script src="data/grammar-practice.js"></script>
  <script src="tools/validate-core.js"></script>
  <script>
    (function () {
      "use strict";
      function el(tag, className, text) {
        var node = document.createElement(tag);
        if (className) node.className = className;
        if (text != null) node.textContent = text;
        return node;
      }
      var result = window.HSK_VALIDATE.validate(window.HSK_VALIDATE.collect(window));
      var summary = document.getElementById("summary");
      summary.appendChild(el("span", "pill " + (result.errors.length ? "error" : "ok"), "错误 " + result.errors.length));
      summary.appendChild(el("span", "pill " + (result.warnings.length ? "warn" : "ok"), "需要确认 " + result.warnings.length));
      var results = document.getElementById("results");
      [["错误（必须修正）", result.errors], ["需要确认", result.warnings], ["统计", result.info]].forEach(function (part) {
        if (!part[1].length) return;
        var box = el("section");
        box.appendChild(el("h2", null, part[0] + " · " + part[1].length));
        var list = el("ul");
        part[1].forEach(function (item) {
          var li = el("li");
          li.appendChild(el("span", "area", "[" + item.area + "]"));
          li.appendChild(document.createTextNode(" " + item.message));
          list.appendChild(li);
        });
        box.appendChild(list);
        results.appendChild(box);
      });

      var button = document.getElementById("audio-check");
      button.addEventListener("click", function () {
        var files = Array.from(new Set((window.HSK_VOCAB || []).map(function (entry) { return entry.audio; }).filter(Boolean)));
        var progress = document.getElementById("audio-progress");
        var status = document.getElementById("audio-status");
        var missing = document.getElementById("audio-missing");
        missing.textContent = "";
        progress.hidden = false;
        progress.max = files.length;
        progress.value = 0;
        button.disabled = true;
        var next = 0, done = 0, bad = 0;
        function load() {
          if (next >= files.length) return;
          var file = files[next++];
          var audio = new Audio();
          audio.preload = "metadata";
          var timer = setTimeout(function () { finish(false); }, 15000);
          function finish(ok) {
            clearTimeout(timer);
            audio.onloadedmetadata = audio.onerror = null;
            audio.removeAttribute("src");
            audio.load();
            done += 1;
            if (!ok) { bad += 1; missing.appendChild(el("li", null, file)); }
            progress.value = done;
            status.textContent = "已检查 " + done + " / " + files.length + "，无法读取 " + bad + " 个。";
            if (done === files.length) { button.disabled = false; status.textContent += bad ? "" : " 全部正常。"; }
            else load();
          }
          audio.onloadedmetadata = function () { finish(true); };
          audio.onerror = function () { finish(false); };
          audio.src = file.split("/").map(encodeURIComponent).join("/");
        }
        for (var i = 0; i < 6; i += 1) load();
      });
    })();
  </script>
</body>
</html>
